name: Owned review cut
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/review-cut.yml'
      - 'tools/browser-tests/record-review-cut.js'
      - 'apps/scope-web/tests/browser/server.mjs'
permissions:
  contents: read
jobs:
  record:
    if: github.repository == 'josepha-mayo/scope-before-payment'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: scope_test
          POSTGRES_USER: scope_fixture
          POSTGRES_PASSWORD: owned_ci_fixture_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scope_fixture -d scope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build only the isolated test frontend
        working-directory: apps/scope-web
        run: |
          npm ci --ignore-scripts
          npm run build:test
      - name: Install recording dependencies
        working-directory: tools/browser-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Record actual UI and PostgreSQL with authored identities and provider replies
        working-directory: tools/browser-tests
        env:
          SCOPE_TEST_DATABASE_URL: postgres://scope_fixture:owned_ci_fixture_only@127.0.0.1:5432/scope_test
        run: node record-review-cut.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-review-cut
          path: tools/browser-tests/review-cut-output
          if-no-files-found: warn
          retention-days: 14
