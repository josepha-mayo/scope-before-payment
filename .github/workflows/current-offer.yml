name: Current offer app
on:
  push:
    branches: [main, release/scope-public-source-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-storage-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: scope_test
          POSTGRES_USER: scope_fixture
          POSTGRES_PASSWORD: owned_ci_fixture_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --port 5432 --username scope_fixture --dbname scope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Resolve deployment paths offline with the official Netlify resolver
        working-directory: tools/netlify-config-check
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Install hosted storage dependencies
        working-directory: apps/scope-web
        run: npm ci --ignore-scripts
      - name: Actual PostgreSQL concurrency, identity isolation and recovery
        working-directory: apps/scope-web
        env:
          SCOPE_TEST_DATABASE_URL: postgres://scope_fixture:owned_ci_fixture_only@127.0.0.1:5432/scope_test
        run: npm test
      - name: Prove TCP readiness excludes the temporary initdb server
        working-directory: apps/scope-web
        run: node tools/postgres-readiness-drill.mjs
      - name: Build production frontend and isolated browser fixture
        working-directory: apps/scope-web
        run: |
          npm run build
          npm run build:test
          npm run build:portable
      - name: Portable SDK sessions and immutable legacy identity mapping (no external requests)
        working-directory: apps/scope-web
        env:
          SCOPE_TEST_DATABASE_URL: postgres://scope_fixture:owned_ci_fixture_only@127.0.0.1:5432/scope_test
        run: npm run test:portable
      - name: Restore application and portable identity together; fence resurrected sessions
        working-directory: apps/scope-web
        env:
          SCOPE_TEST_DATABASE_URL: postgres://scope_fixture:owned_ci_fixture_only@127.0.0.1:5432/scope_test
          SCOPE_AUTH_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: node portable/tools/recovery-drill.mjs
      - name: Install hosted browser checks
        working-directory: tools/browser-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Hosted UI through actual HTTP and PostgreSQL (authored identity only)
        working-directory: tools/browser-tests
        env:
          SCOPE_TEST_DATABASE_URL: postgres://scope_fixture:owned_ci_fixture_only@127.0.0.1:5432/scope_test
        run: npm run test:hosted
      - name: Portable browser through real SDK cookies, verified database TLS and read-only runtime
        working-directory: tools/browser-tests
        env:
          SCOPE_TEST_DATABASE_URL: postgres://scope_fixture:owned_ci_fixture_only@127.0.0.1:5432/scope_test
          SCOPE_AUTH_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: npx playwright test --config portable/playwright.config.js
      - name: Restore owned PostgreSQL data and verify recovery holds
        working-directory: apps/scope-web
        env:
          SCOPE_TEST_DATABASE_URL: postgres://scope_fixture:owned_ci_fixture_only@127.0.0.1:5432/scope_test
          SCOPE_RESTORE_CONTAINER: ${{ job.services.postgres.id }}
        run: node tools/restore-drill.mjs
      - name: Run the public local rehearsal launcher through Chromium and remove its owned container
        working-directory: tools/browser-tests
        run: node rehearsal-smoke.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          archive: true
          include-hidden-files: false
          name: local-rehearsal-receipt
          path: |
            tools/browser-tests/rehearsal-receipt.json
            tools/browser-tests/rehearsal-overview.png
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          archive: true
          include-hidden-files: false
          name: owned-portable-browser-views
          path: |
            tools/browser-tests/portable-login-desktop.png
            tools/browser-tests/portable-login-mobile.png
            tools/browser-tests/portable-private-readonly.png
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          archive: true
          include-hidden-files: false
          name: owned-restore-receipt
          path: apps/scope-web/restore-receipt.json
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          archive: true
          include-hidden-files: false
          name: owned-portable-auth-restore-receipt
          path: apps/scope-web/portable/restore-receipt.json
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          archive: true
          include-hidden-files: false
          name: hosted-browser-report
          path: |
            tools/browser-tests/playwright-report
            tools/browser-tests/test-results
          retention-days: 7
  windows-ai-verification:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Native SQLite and synthetic DPAPI contracts (no provider IO)
        run: node --test --test-concurrency=1 experiments/scope-to-quote/tests/nvidia-key-loader-test.js experiments/scope-to-quote/tests/nvidia-service-test.js experiments/scope-to-quote/tests/nvidia-launcher-test.js experiments/scope-to-quote/tests/partial-draft-test.js experiments/scope-to-quote/tests/nonprice-protocol-test.js experiments/scope-to-quote/tests/mode-disclosure-test.js experiments/scope-to-quote/tests/first-run-recovery-test.js
  linux-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify native locking prerequisite
        run: test -x /usr/bin/flock
      - name: Current app and shared email variant
        run: node --test --test-concurrency=1 experiments/scope-to-quote/tests/*test.js experiments/email-bound-offer-checkout/tests/*test.js
      - name: Python worker contracts (fake IO only)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 experiments/scope-to-quote/tests/runtime-worker-test.py
          python3 experiments/scope-to-quote/tests/runtime-span-worker-test.py
      - name: Install browser test dependencies
        working-directory: tools/browser-tests
        run: npm ci
      - name: Install Chromium
        working-directory: tools/browser-tests
        run: npx playwright install --with-deps chromium
      - name: Native browser complete authored journey
        working-directory: tools/browser-tests
        run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          archive: true
          include-hidden-files: false
          name: authored-browser-report
          path: |
            tools/browser-tests/playwright-report
            tools/browser-tests/test-results
          retention-days: 7
  public-source-secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch only the checked-out commit ancestry
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin "$GITHUB_SHA"
          fi
      - name: Verify and run the pinned secret scanner
        run: |
          mkdir "$RUNNER_TEMP/scope-gitleaks"
          # Bound transient release-download failures; permanent 4xx and checksum failures stay fatal.
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 20 --retry 2 --retry-delay 2 --retry-max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/scope-gitleaks/gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$RUNNER_TEMP/scope-gitleaks/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/scope-gitleaks/gitleaks.tar.gz" -C "$RUNNER_TEMP/scope-gitleaks"
          "$RUNNER_TEMP/scope-gitleaks/gitleaks" git --config .gitleaks.toml --log-opts=HEAD --redact --ignore-gitleaks-allow --no-banner --no-color --log-level error .
